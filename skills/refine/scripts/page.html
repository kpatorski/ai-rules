<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refine</title>
<style>
  /* Palette of the craftsman dashboard; the light set mirrors it. */
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel2: #2d2d30; --border: #333; --text: #d4d4d4; --heading: #f0f0f0;
    --green: #4ec9b0; --blue: #9cdcfe; --muted: #808080; --amber: #d7ba7d; --red: #f48771;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg: #ffffff; --panel: #f3f3f3; --panel2: #e8e8e8; --border: #d4d4d4; --text: #333333; --heading: #1e1e1e;
      --green: #16825d; --blue: #0b62a8; --muted: #6e6e6e; --amber: #8f6a00; --red: #c4391c;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --panel: #f3f3f3; --panel2: #e8e8e8; --border: #d4d4d4; --text: #333333; --heading: #1e1e1e;
    --green: #16825d; --blue: #0b62a8; --muted: #6e6e6e; --amber: #8f6a00; --red: #c4391c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: var(--blue); }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 1px solid var(--border); border-radius: 3px; padding: 1px 8px;
    font-size: 12px; line-height: 1.5; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { border-color: var(--green); color: var(--green); }
  button.primary:hover { background: color-mix(in srgb, var(--green) 14%, transparent); border-color: var(--green); }
  button.quiet { background: none; border-color: transparent; color: var(--muted); }
  input, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; }
  input:focus, textarea:focus { outline: none; border-color: var(--blue); }
  textarea { width: 100%; min-height: 64px; resize: vertical; display: block; }

  /* ---- top bar ---- */
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 8px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  .topbar .file { font-family: var(--mono); font-size: 13px; color: var(--heading); }
  .topbar .counts { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: 1; }
  .topbar .unsaved { font-size: 12px; color: var(--amber); }
  .topbar input, .topbar button { height: 26px; font-size: 12px; line-height: 1; }
  .topbar input { width: 140px; padding: 0 8px; }
  .topbar input.needed { border-color: var(--red); }
  .topbar .group { display: flex; align-items: center; gap: 6px; }
  .topbar .group + .group { padding-left: 12px; border-left: 1px solid var(--border); }
  .topbar .actions button { width: 64px; padding: 0; }
  .topbar button.icon { min-width: 26px; padding: 0 6px; color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .topbar button.icon:hover { color: var(--text); }

  /* ---- layout ---- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; max-width: 1280px; margin: 0 auto;
    padding: 24px 20px 120px; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  /* ---- story ---- */
  .story h1, .story h2, .story h3, .story h4, .story h5, .story h6 { color: var(--heading); line-height: 1.3;
    margin: 1.4em 0 0.5em; }
  .story h1 { font-size: 26px; } .story h2 { font-size: 21px; } .story h3 { font-size: 17px; }
  .story h4, .story h5, .story h6 { font-size: 15px; }
  .story > :first-child { margin-top: 0; }
  .story p { margin: 0.7em 0; }
  .story li > p { margin: 0.2em 0; }
  .story ul, .story ol { padding-left: 1.7em; margin: 0.6em 0; }
  .story code { font-family: var(--mono); font-size: 13px; color: var(--blue); }
  .story pre { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px;
    overflow-x: auto; white-space: pre; }
  .story pre code { color: var(--text); }
  .story blockquote { margin: 0.8em 0; padding: 2px 14px; border-left: 3px solid var(--border); color: var(--muted); }
  .story hr { border: 0; border-top: 1px solid var(--border); margin: 1.4em 0; }
  .story .table-wrap { overflow-x: auto; margin: 0.8em 0; }
  .story table { border-collapse: collapse; }
  .story th, .story td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; vertical-align: top; }
  .story th { background: var(--panel); color: var(--heading); }

  /* ---- editable blocks and their change marks ---- */
  .story { padding-left: 76px; }
  .unit { position: relative; }
  /* The tools column spans the whole height of the block and reaches up to its text, so the pointer never
     crosses a dead gap on its way to a button. */
  .unit-tools { position: absolute; top: 0; bottom: 0; left: -76px; width: 76px; display: flex; align-items: flex-start;
    gap: 4px; visibility: hidden; }
  li.unit > .unit-tools { left: calc(-76px - 1.7em); width: calc(76px + 1.7em); }
  .unit:hover > .unit-tools { visibility: visible; }
  .unit-tools button { width: 28px; height: 28px; padding: 0; border-radius: 4px; border-color: transparent; color: var(--muted);
    font-size: 16px; line-height: 1; }
  .unit-tools button:hover { color: var(--heading); background: var(--panel2); border-color: var(--border); }
  .change-bar { position: absolute; top: 2px; bottom: 2px; left: -10px; width: 4px; padding: 0; border: 0; border-radius: 2px;
    background: var(--muted); opacity: 0.55; }
  li.unit > .change-bar { left: calc(-10px - 1.7em); }
  .unit.fresh > .change-bar { background: var(--blue); opacity: 1; }
  .change-bar:hover { opacity: 1; width: 6px; }
  .was, .source-form { margin: 6px 0 12px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px; font-size: 13px; }
  .was .who, .removed-note { font-size: 12px; color: var(--muted); }
  .was.fresh, .removed-note.fresh { border-left: 3px solid var(--blue); }
  .was pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 var(--mono);
    background: none; border: 0; padding: 0; }
  .was del { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
  .was ins { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); text-decoration: none; }
  .removed-note { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 2px 8px; border-style: dashed; }
  .removed-note.fresh { color: var(--blue); }
  .source-form { display: flex; flex-direction: column; gap: 6px; }
  .source-form textarea { font: 13px/1.5 var(--mono); }
  .source-form .row { display: flex; align-items: center; gap: 8px; }
  .messages li.fresh { box-shadow: inset 3px 0 0 var(--blue); }
  .new-tag { font: 10px var(--mono); color: var(--blue); border: 1px solid var(--blue); border-radius: 8px; padding: 0 5px;
    margin-left: 6px; }

  /* ---- questioned fragments ---- */
  .q { background: color-mix(in srgb, var(--amber) 22%, transparent); border-bottom: 2px solid var(--amber);
    border-radius: 2px; cursor: pointer; }
  .q[data-status="resolved"] { background: color-mix(in srgb, var(--green) 16%, transparent);
    border-bottom-color: var(--green); }
  .q.is-open { background: color-mix(in srgb, var(--amber) 40%, transparent); }
  .q[data-status="resolved"].is-open { background: color-mix(in srgb, var(--green) 32%, transparent); }
  .q.q-last::after { content: attr(data-label); font: 600 10px var(--mono); vertical-align: super; margin-left: 2px;
    color: var(--amber); }
  .q[data-status="resolved"].q-last::after { color: var(--green); }
  .q.flash, .story :is(h1, h2, h3, h4, h5, h6).flash { outline: 2px solid var(--blue); }
  .story :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: 64px; }

  /* ---- thread ---- */
  .thread { margin: 8px 0 14px; background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--amber); border-radius: 4px; font-size: 14px; color: var(--text);
    white-space: normal; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .thread[data-status="resolved"] { border-left-color: var(--green); }
  .thread-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .thread-head .tid { font: 600 13px var(--mono); color: var(--heading); }
  .thread-head .fragment { flex: 1; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .badge { font: 11px var(--mono); padding: 0 6px; border-radius: 8px; border: 1px solid var(--amber);
    color: var(--amber); }
  .badge.resolved { border-color: var(--green); color: var(--green); }
  .messages { list-style: none; margin: 0; padding: 0; }
  .messages li { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .messages .meta { font-size: 12px; color: var(--muted); }
  .messages .meta .n { font-family: var(--mono); margin-right: 6px; }
  .messages .meta b { color: var(--blue); font-weight: 600; margin-right: 6px; }
  .messages .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .thread .none { padding: 8px 10px; color: var(--muted); margin: 0; }
  .thread form { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .thread form .row { display: flex; align-items: center; gap: 8px; }
  .hint { font-size: 12px; color: var(--muted); flex: 1; }

  /* ---- sidebar ---- */
  .side { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 84px); overflow-y: auto; }
  .side-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .side-head h2 { flex: 1; margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); }
  .side-head button.on { border-color: var(--blue); color: var(--blue); }
  .entry { display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 7px 10px; background: var(--panel);
    font-size: 13px;
    border-left: 3px solid var(--amber); }
  .entry[data-status="resolved"] { border-left-color: var(--green); opacity: 0.75; }
  .entry.is-open { background: var(--panel2); border-color: var(--muted); border-left-color: var(--amber); opacity: 1; }
  .entry[data-status="resolved"].is-open { border-left-color: var(--green); }
  .entry .line { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); }
  .entry .tid { font: 600 12px var(--mono); color: var(--heading); }
  .entry .fragment { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .ask { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  .empty { color: var(--muted); font-size: 13px; }

  /* ---- floating bits ---- */
  .ask-button, .ask-button.primary:hover { position: absolute; z-index: 8; height: 26px; padding: 0 10px; background: var(--panel);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); }
  .ask-button.primary:hover { background: var(--panel2); }
  .composer { position: absolute; z-index: 9; width: min(420px, calc(100vw - 24px)); padding: 10px; background: var(--panel);
    border: 1px solid var(--blue); border-radius: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); display: flex;
    flex-direction: column; gap: 8px; }
  .composer .about { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .composer .row { display: flex; gap: 8px; align-items: center; }
  .tip { position: absolute; z-index: 7; max-width: 380px; padding: 8px 10px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 4px; font-size: 13px; pointer-events: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); }
  .tip .meta { font: 11px var(--mono); color: var(--muted); }
  .tip .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .help { position: fixed; z-index: 9; top: 48px; right: 20px; width: min(400px, calc(100vw - 24px)); padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
  .help ul { margin: 0; padding-left: 1.2em; }
  .help li { margin: 3px 0; }
  .help b { color: var(--heading); font-weight: 600; }
  .help .made { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px;
    color: var(--muted); }
  .help code { font-family: var(--mono); font-size: 11.5px; color: var(--blue); }
  .toast { position: fixed; z-index: 10; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
  .toast.error { border-color: var(--red); color: var(--red); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<!--REFINE_DATA-->
<script>/*REFINE_CORE*/</script>
<script>
(function () {
  'use strict';

  const core = window.RefineCore;
  const dataElement = document.getElementById('refine-data');
  const source = JSON.parse(dataElement.textContent);
  const app = document.getElementById('app');

  const state = {
    doc: core.readDocument(source.markdown),
    open: new Set(),
    drafts: new Map(),
    onlyOpen: false,
    dirty: false,
    fileHandle: null,
    pending: null,
    editing: null,
    shownBefore: new Set(),
  };

  function h(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (key === 'class') node.className = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else if (value !== false && value != null) node.setAttribute(key, value === true ? '' : value);
    }
    node.append(...children.flat(Infinity).filter((child) => child != null && child !== false));
    return node;
  }

  function remembered(key) {
    try {
      return window.localStorage.getItem(key) || '';
    } catch (unavailable) {
      return '';
    }
  }

  function remember(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (unavailable) {
      /* private mode or blocked storage: the value simply is not remembered */
    }
  }

  // ---- page skeleton -------------------------------------------------------------------------

  const counts = h('span', { class: 'counts' });
  const unsaved = h('span', { class: 'unsaved', hidden: true }, 'unsaved changes');
  const author = h('input', { type: 'text', placeholder: 'Your name', 'aria-label': 'Your name', maxlength: '40' });
  const story = h('main', { class: 'story' });
  const entries = h('div', {});
  const filter = h('button', { type: 'button', onclick: toggleFilter }, 'Open only');
  const askButton = h('button', { class: 'ask-button primary', type: 'button', hidden: true }, 'Ask about this');
  const composer = h('form', { class: 'composer', hidden: true });
  const tip = h('div', { class: 'tip', hidden: true });
  const toast = h('div', { class: 'toast', hidden: true, role: 'status' });
  const help = h('div', { class: 'help', hidden: true },
    h('ul', {},
      h('li', {}, 'Type ', h('b', {}, 'your name'), ' in the top bar; it signs your messages.'),
      h('li', {}, h('b', {}, 'Highlighted text'), ' has a question: hover to preview, click to open, click again to close.'),
      h('li', {}, 'To ask something new, ', h('b', {}, 'select text'), ' in the story and press “Ask about this”.'),
      h('li', {}, h('b', {}, 'Resolve'), ' marks a question as settled; Reopen undoes it.'),
      h('li', {}, 'To ', h('b', {}, 'change the story'), ', point at a paragraph or list item: ✎ edits it, + adds a block below it.'),
      h('li', {}, 'A ', h('b', {}, 'bar on the left'), ' marks changed text — blue if it changed since you last saved. Click it to see what it was.'),
      h('li', {}, h('b', {}, 'Save'), ' is the only button you need: it writes your changes into this page. Send the saved file back.'),
      h('li', {}, h('b', {}, '.md'), ' is optional: it downloads the story as markdown with all questions and answers.')),
    h('p', { class: 'made' }, 'Made with the ', h('code', {}, 'refine'), ' skill for Claude Code. ',
      h('code', {}, '/refine <file>'), ' turns markdown into this page and back.'));

  author.value = remembered('refine.author');
  author.addEventListener('input', () => {
    author.classList.remove('needed');
    remember('refine.author', author.value.trim());
    render();
  });

  app.append(
    h('header', { class: 'topbar' },
      h('span', { class: 'file' }, source.fileName),
      counts,
      unsaved,
      h('div', { class: 'group' }, author),
      h('div', { class: 'group actions' },
        h('button', { type: 'button', class: 'primary', onclick: save, title: 'Save this page (Ctrl/⌘+S)' }, 'Save')),
      h('div', { class: 'group' },
        h('button', { type: 'button', class: 'icon', onclick: exportMarkdown, title: 'Export the story as markdown, with its questions', 'aria-label': 'Export as markdown' }, '.md'),
        h('button', { type: 'button', class: 'icon', onclick: toggleTheme, title: 'Switch light / dark', 'aria-label': 'Switch light / dark' }, '◐'),
        h('button', { type: 'button', class: 'icon', onclick: () => { help.hidden = !help.hidden; }, title: 'How this page works', 'aria-label': 'Help' }, '?'))),
    h('div', { class: 'layout' },
      story,
      h('aside', { class: 'side' }, h('div', { class: 'side-head' }, h('h2', {}, 'Questions'), filter), entries)),
    askButton,
    composer,
    tip,
    help,
    toast,
  );

  // ---- story ---------------------------------------------------------------------------------

  // What counts as new is fixed when the page opens: everything since this reader last saved.
  // Saving during the session must not make the marks vanish while the reader is still looking.
  const opened = source.history || core.newHistory(state.doc.text, now());
  state.history = opened;

  function reader() {
    return author.value.trim();
  }

  function isNew(message) {
    return core.isNewFor(opened, reader(), message);
  }

  function render() {
    const scrolled = window.scrollY;
    const marks = core.changeMarks(state.doc, state.history, core.referenceText(opened, reader()));
    const units = core.units(state.doc);
    let index = 0;
    const unitNode = (tag, content) => unitOf(tag, index, units[index], marks.units[index++], content, marks.removed);
    story.replaceChildren(
      ...removedNotes(marks.removed, -1),
      ...core.layout(state.doc).map((block) => (block.type === 'list'
        ? h(block.ordered ? 'ol' : 'ul', { start: block.ordered ? String(block.start) : null },
          block.items.map((item) => unitNode('li', item.map(blockNode))))
        : unitNode('div', [blockNode(block)]))));
    const fresh = marks.units.filter((m) => m && m.fresh).length + marks.removed.filter((r) => r.fresh).length;
    for (const thread of state.doc.threads) {
      const pieces = story.querySelectorAll(`.q[data-q="${thread.id}"]`);
      if (pieces.length) pieces[pieces.length - 1].classList.add('q-last');
      if (state.open.has(thread.id)) placeThread(thread, pieces[0]);
    }
    renderEntries();
    const open = state.doc.threads.filter((t) => t.status === 'open').length;
    const changes = fresh ? ` · ${fresh} new change${fresh === 1 ? '' : 's'}` : '';
    counts.textContent = `${open} open · ${state.doc.threads.length - open} resolved${changes}`;
    unsaved.hidden = !state.dirty;
    window.scrollTo(0, scrolled);
  }

  // ---- editable blocks ------------------------------------------------------------------------

  function unitOf(tag, index, unit, mark, content, removed) {
    const editing = state.editing && state.editing.unit === index ? state.editing : null;
    const classes = ['unit', mark ? 'changed' : '', mark && mark.fresh ? 'fresh' : ''].filter(Boolean).join(' ');
    return h(tag, { class: classes, 'data-unit': String(index) },
      h('span', { class: 'unit-tools' },
        h('button', { type: 'button', title: 'Edit this block', 'aria-label': 'Edit this block', onclick: () => edit(index, 'edit') }, '✎'),
        h('button', { type: 'button', title: 'Add a block below', 'aria-label': 'Add a block below', onclick: () => edit(index, 'add') }, '+')),
      mark ? h('button', { type: 'button', class: 'change-bar', title: `${signature(mark)} — click to see what it was`,
        'aria-label': 'Show the previous text', onclick: () => toggleBefore(`u${index}`) }) : null,
      editing && editing.mode === 'edit' ? sourceForm(index, unit, editing) : content,
      mark && state.shownBefore.has(`u${index}`) ? previousText(mark, state.doc.text.slice(unit.start, unit.end)) : null,
      editing && editing.mode === 'add' ? sourceForm(index, unit, editing) : null,
      removedNotes(removed, index));
  }

  function signature(change) {
    const what = { changed: 'Changed', added: 'Added', removed: 'Removed' }[change.kind || 'removed'];
    return change.author ? `${what} by ${change.author} · ${change.at}` : `${what} just now, not saved yet`;
  }

  function previousText(mark, current) {
    const body = mark.kind === 'added' ? null : h('pre', {}, core.diff(mark.before, current).map((part) => (part.same
      ? mark.before.slice(part.a[0], part.a[1])
      : [h('del', {}, mark.before.slice(part.a[0], part.a[1])), h('ins', {}, current.slice(part.b[0], part.b[1]))])));
    return h('div', { class: `was${mark.fresh ? ' fresh' : ''}` }, h('div', { class: 'who' }, signature(mark)), body);
  }

  function removedNotes(removed, after) {
    return removed.filter((r) => r.after === after).map((r, k) => {
      const key = `r${after}:${k}`;
      return h('div', {},
        h('button', { type: 'button', class: `removed-note${r.fresh ? ' fresh' : ''}`, onclick: () => toggleBefore(key) },
          `− a block was removed here · ${signature(r)}`),
        state.shownBefore.has(key)
          ? h('div', { class: `was${r.fresh ? ' fresh' : ''}` }, h('pre', {}, h('del', {}, r.text)))
          : null);
    });
  }

  function toggleBefore(key) {
    if (state.shownBefore.has(key)) state.shownBefore.delete(key);
    else state.shownBefore.add(key);
    render();
  }

  function edit(unit, mode) {
    state.editing = { unit, mode, draft: null };
    render();
    const field = story.querySelector('.source-form textarea');
    if (field) field.focus({ preventScroll: true });
  }

  // The markdown of one block, to change it — or an empty form to write a new block after it.
  function sourceForm(index, unit, editing) {
    const adding = editing.mode === 'add';
    const field = h('textarea', { 'aria-label': adding ? 'New block, in markdown' : 'This block, in markdown' });
    field.value = editing.draft !== null ? editing.draft : adding ? unit.next : state.doc.text.slice(unit.start, unit.end);
    field.rows = Math.max(3, field.value.split('\n').length + 1);
    field.addEventListener('input', () => { editing.draft = field.value; });
    const signedBy = () => ({ author: author.value, at: now() });
    const finish = (next) => {
      if (!signed()) return;
      state.editing = null;
      if (change(next)) return;
      state.editing = { ...editing, draft: field.value };
      render();
    };
    return h('form', {
      class: 'source-form',
      onsubmit: (event) => {
        event.preventDefault();
        finish(() => (adding
          ? core.addUnitAfter(state.doc, index, field.value, signedBy())
          : core.editUnit(state.doc, index, field.value, signedBy())));
      },
    },
      field,
      h('div', { class: 'row' },
        h('span', { class: 'hint' }, adding ? 'Markdown · Ctrl/⌘+Enter adds' : 'Markdown · Ctrl/⌘+Enter saves the block'),
        adding ? null : h('button', { type: 'button', class: 'quiet', onclick: () => finish(() => core.removeUnit(state.doc, index, signedBy())) }, 'Delete block'),
        h('button', { type: 'button', onclick: () => { state.editing = null; render(); } }, 'Cancel'),
        h('button', { type: 'submit', class: 'primary' }, adding ? 'Add' : 'Done')));
  }

  function blockNode(block) {
    switch (block.type) {
      case 'heading':
        return h(`h${block.level}`, { id: block.slug || null, 'data-inline': true }, inlineNodes(block.inline));
      case 'code':
        return h('pre', {}, h('code', { 'data-inline': true }, inlineNodes(block.inline)));
      case 'rule':
        return h('hr', {});
      case 'quote':
        return h('blockquote', {}, block.blocks.map(blockNode));
      case 'list':
        return h(block.ordered ? 'ol' : 'ul', { start: block.ordered ? String(block.start) : null },
          block.items.map((item) => h('li', {}, item.map(blockNode))));
      case 'table': {
        const row = (cells, tag) => h('tr', {}, cells.map((cell) => h(tag, { 'data-inline': true }, inlineNodes(cell))));
        return h('div', { class: 'table-wrap' },
          h('table', {}, h('thead', {}, row(block.head, 'th')), h('tbody', {}, block.rows.map((r) => row(r, 'td')))));
      }
      default:
        return h('p', { 'data-inline': true }, inlineNodes(block.inline));
    }
  }

  function inlineNodes(nodes) {
    return nodes.map((node) => {
      switch (node.type) {
        case 'text':
          return textNode(node);
        case 'break':
          return h('br', {});
        case 'strong':
          return h('strong', {}, inlineNodes(node.children));
        case 'em':
          return h('em', {}, inlineNodes(node.children));
        case 'del':
          return h('del', {}, inlineNodes(node.children));
        case 'code':
          return h('code', {}, inlineNodes(node.children));
        default:
          return linkNode(node);
      }
    });
  }

  // Text nodes remember where they come from in the story, so a selection can be mapped back.
  function textNode(piece) {
    const text = document.createTextNode(piece.text);
    text.storyStart = piece.start;
    text.storyEnd = piece.end;
    text.atomic = Boolean(piece.atomic);
    return piece.questions.reduceRight((inner, id) => {
      const open = state.open.has(id) ? ' is-open' : '';
      return h('span', { class: `q${open}`, 'data-q': id, 'data-label': label(id), 'data-status': threadOf(id).status }, inner);
    }, text);
  }

  function linkNode(node) {
    const safe = /^(https?:|mailto:)/i.test(node.href) || !/^[a-z][a-z0-9+.-]*:/i.test(node.href);
    if (!safe) return h('span', {}, inlineNodes(node.children));
    const href = core.pageHref(node.href);
    const elsewhere = href.startsWith('#') ? {} : { target: '_blank', rel: 'noopener noreferrer' };
    return h('a', { href, ...elsewhere }, inlineNodes(node.children));
  }

  // Questions are stored as q1, q2, …; people see them as #1, #2, ….
  function label(id) {
    return `#${id.slice(1)}`;
  }

  function threadOf(id) {
    return state.doc.threads.find((t) => t.id === id);
  }

  function fragmentOf(id) {
    const anchor = state.doc.anchors.find((a) => a.id === id);
    return anchor ? state.doc.text.slice(anchor.start, anchor.end).replace(/\s+/g, ' ') : '';
  }

  // ---- threads -------------------------------------------------------------------------------

  function placeThread(thread, firstPiece) {
    const panel = threadPanel(thread);
    if (!firstPiece) {
      story.append(panel);
      return;
    }
    const container = firstPiece.closest('[data-inline]');
    let host = container.closest('.table-wrap') || (container.tagName === 'CODE' ? container.parentElement : container);
    while (host.nextElementSibling && host.nextElementSibling.classList.contains('thread')) host = host.nextElementSibling;
    host.after(panel);
  }

  function threadPanel(thread) {
    const resolved = thread.status === 'resolved';
    const reply = h('textarea', { placeholder: 'Write a reply…', 'aria-label': `Reply to ${label(thread.id)}` });
    reply.value = state.drafts.get(thread.id) || '';
    reply.addEventListener('input', () => state.drafts.set(thread.id, reply.value));
    const fragment = fragmentOf(thread.id);
    return h('section', { class: 'thread', 'data-thread': thread.id, 'data-status': thread.status },
      h('div', { class: 'thread-head' },
        h('span', { class: 'tid' }, label(thread.id)),
        h('span', { class: `badge ${thread.status}` }, thread.status),
        h('span', { class: 'fragment' }, fragment ? `“${fragment}”` : 'the questioned text is no longer in the story'),
        h('button', { type: 'button', onclick: () => change(() => (resolved ? core.reopen : core.resolve)(state.doc, thread.id)) },
          resolved ? 'Reopen' : 'Resolve'),
        h('button', { type: 'button', class: 'quiet', onclick: () => remove(thread) }, 'Delete'),
        h('button', { type: 'button', class: 'quiet', title: 'Collapse', onclick: () => toggle(thread.id) }, '✕')),
      thread.messages.length
        ? h('ol', { class: 'messages' }, thread.messages.map((m) =>
            h('li', { class: isNew(m) ? 'fresh' : '' },
              h('div', { class: 'meta' }, h('span', { class: 'n' }, `${m.n}.`), h('b', {}, m.author), m.at,
                isNew(m) ? h('span', { class: 'new-tag' }, 'new') : null),
              h('div', { class: 'text' }, m.text))))
        : h('p', { class: 'none' }, 'No messages yet.'),
      h('form', { onsubmit: (event) => send(event, thread.id, reply) },
        reply,
        h('div', { class: 'row' },
          h('span', { class: 'hint' }, 'Ctrl/⌘+Enter sends'),
          h('button', { type: 'submit', class: 'primary' }, 'Send'))));
  }

  function toggle(id) {
    if (state.open.has(id)) state.open.delete(id);
    else state.open.add(id);
    hideTip();
    render();
  }

  function send(event, id, reply) {
    event.preventDefault();
    if (!signed()) return;
    const sent = change(() => core.reply(state.doc, id, { author: author.value, at: now(), text: reply.value }));
    if (!sent) return;
    state.drafts.delete(id);
    render();
    const again = story.querySelector(`.thread[data-thread="${id}"] textarea`);
    if (again) again.focus({ preventScroll: true });
  }

  function remove(thread) {
    const size = thread.messages.length;
    if (!window.confirm(`Delete question ${label(thread.id)} and its ${size} message${size === 1 ? '' : 's'}?`)) return;
    state.open.delete(thread.id);
    state.drafts.delete(thread.id);
    change(() => core.removeQuestion(state.doc, thread.id));
  }

  function change(next) {
    let changed;
    try {
      changed = next();
    } catch (problem) {
      notify(problem.message, true);
      return false;
    }
    state.dirty = state.dirty || changed !== state.doc;
    state.doc = changed;
    render();
    return true;
  }

  function signed() {
    if (author.value.trim()) return true;
    author.classList.add('needed');
    author.focus();
    notify('Enter your name first — it signs your messages.', true);
    return false;
  }

  function now() {
    const d = new Date();
    const two = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`;
  }

  // ---- question list -------------------------------------------------------------------------

  function renderEntries() {
    const shown = state.doc.threads.filter((t) => !state.onlyOpen || t.status === 'open');
    filter.classList.toggle('on', state.onlyOpen);
    if (!shown.length) {
      const none = state.doc.threads.length ? 'No open questions.' : 'Select any text in the story to ask a question.';
      entries.replaceChildren(h('p', { class: 'empty' }, none));
      return;
    }
    entries.replaceChildren(...shown.map((thread) => {
      const first = thread.messages[0];
      const last = thread.messages[thread.messages.length - 1];
      const open = state.open.has(thread.id) ? ' is-open' : '';
      return h('button', { type: 'button', class: `entry${open}`, 'data-status': thread.status, onclick: () => reveal(thread.id) },
        h('div', { class: 'line' },
          h('span', { class: 'tid' }, label(thread.id)),
          h('span', { class: 'fragment' }, fragmentOf(thread.id) || 'no anchor'),
          thread.messages.some(isNew) ? h('span', { class: 'new-tag' }, 'new') : null,
          h('span', {}, `${thread.messages.length} msg`)),
        h('div', { class: 'ask' }, first ? first.text : 'No messages yet.'),
        last && last !== first ? h('div', { class: 'line' }, `last: ${last.author} · ${last.at}`) : null);
    }));
  }

  function toggleFilter() {
    state.onlyOpen = !state.onlyOpen;
    renderEntries();
  }

  // Clicking a listed question opens it and scrolls to it; clicking it again collapses it.
  function reveal(id) {
    if (state.open.has(id)) {
      toggle(id);
      return;
    }
    state.open.add(id);
    render();
    const target = story.querySelector(`.q[data-q="${id}"]`) || story.querySelector(`.thread[data-thread="${id}"]`);
    if (!target) return;
    target.scrollIntoView({ block: 'center' });
    flash(target);
  }

  function flash(target) {
    target.classList.add('flash');
    window.setTimeout(() => target.classList.remove('flash'), 1200);
  }

  // A link with a fragment — from another story's page or from this one — lands on the heading it names.
  function jumpToFragment() {
    const id = fragment();
    const target = id ? document.getElementById(id) : null;
    if (!target || !story.contains(target)) return;
    target.scrollIntoView({ block: 'start' });
    flash(target);
  }

  function fragment() {
    try {
      return decodeURIComponent(window.location.hash.slice(1));
    } catch (malformed) {
      return '';
    }
  }

  // ---- asking about a selection --------------------------------------------------------------

  // The selected part of the story, limited to the paragraph/cell/heading where the selection starts.
  function selectedFragment() {
    const selection = window.getSelection();
    if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;
    const range = selection.getRangeAt(0);
    const walker = document.createTreeWalker(story, NodeFilter.SHOW_TEXT);
    let container = null;
    let start = Infinity;
    let end = -1;
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      if (node.storyStart === undefined || !range.intersectsNode(node)) continue;
      const from = node === range.startContainer ? range.startOffset : 0;
      const to = node === range.endContainer ? range.endOffset : node.length;
      if (from >= to) continue;
      const own = node.parentElement.closest('[data-inline]');
      container = container || own;
      if (own !== container) break;
      start = Math.min(start, node.atomic ? node.storyStart : node.storyStart + from);
      end = Math.max(end, node.atomic ? node.storyEnd : node.storyStart + to);
    }
    if (end === -1 || !state.doc.text.slice(start, end).trim()) return null;
    return { start, end, rect: range.getBoundingClientRect() };
  }

  function offerToAsk() {
    if (!composer.hidden) return;
    state.pending = selectedFragment();
    askButton.hidden = !state.pending;
    if (state.pending) floatBelow(askButton, state.pending.rect);
  }

  function floatBelow(node, rect) {
    node.hidden = false;
    const left = Math.max(8, Math.min(rect.left, document.documentElement.clientWidth - node.offsetWidth - 8));
    node.style.left = `${left + window.scrollX}px`;
    node.style.top = `${rect.bottom + window.scrollY + 6}px`;
  }

  function openComposer() {
    const pending = state.pending;
    const text = h('textarea', { placeholder: 'What is unclear here?', 'aria-label': 'Your question' });
    const about = state.doc.text.slice(pending.start, pending.end).replace(/\s+/g, ' ').trim();
    composer.replaceChildren(
      h('div', { class: 'about' }, `About “${about}”`),
      text,
      h('div', { class: 'row' },
        h('span', { class: 'hint' }, 'Ctrl/⌘+Enter asks'),
        h('button', { type: 'button', onclick: closeComposer }, 'Cancel'),
        h('button', { type: 'submit', class: 'primary' }, 'Ask')));
    composer.onsubmit = (event) => {
      event.preventDefault();
      if (!signed()) return;
      const asked = change(() => core.askQuestion(state.doc, { ...pending, author: author.value, at: now(), text: text.value }));
      if (!asked) return;
      closeComposer();
      state.open.add(state.doc.threads[state.doc.threads.length - 1].id);
      render();
    };
    askButton.hidden = true;
    floatBelow(composer, pending.rect);
    text.focus({ preventScroll: true });
  }

  function closeComposer() {
    composer.hidden = true;
    state.pending = null;
  }

  askButton.addEventListener('mousedown', (event) => event.preventDefault());
  askButton.addEventListener('click', openComposer);
  document.addEventListener('mouseup', () => window.setTimeout(offerToAsk, 0));
  document.addEventListener('keyup', (event) => {
    if (event.shiftKey || event.key === 'Shift') offerToAsk();
  });

  // ---- hovering and clicking questioned fragments ---------------------------------------------

  story.addEventListener('click', (event) => {
    const piece = event.target.closest && event.target.closest('.q');
    const selecting = !window.getSelection().isCollapsed;
    if (piece && !selecting) toggle(piece.dataset.q);
  });

  story.addEventListener('mouseover', (event) => {
    const piece = event.target.closest && event.target.closest('.q');
    if (!piece || state.open.has(piece.dataset.q)) return;
    const thread = threadOf(piece.dataset.q);
    const first = thread.messages[0];
    const replies = thread.messages.length - 1;
    tip.replaceChildren(
      h('div', { class: 'meta' }, `${label(thread.id)} · ${thread.status}${first ? ` · ${first.author}` : ''}`),
      h('div', { class: 'text' }, first ? clipped(first.text, 240) : 'No messages yet.'),
      h('div', { class: 'meta' }, `${replies > 0 ? `${replies} repl${replies === 1 ? 'y' : 'ies'} · ` : ''}click to open`));
    floatBelow(tip, piece.getBoundingClientRect());
  });

  story.addEventListener('mouseout', (event) => {
    if (event.target.closest && event.target.closest('.q')) hideTip();
  });

  function hideTip() {
    tip.hidden = true;
  }

  function clipped(text, length) {
    return text.length > length ? `${text.slice(0, length)}…` : text;
  }

  // ---- saving --------------------------------------------------------------------------------

  // The whole page again, with the current story and threads embedded instead of the loaded ones.
  function pageHtml(history) {
    const page = document.documentElement.cloneNode(true);
    page.removeAttribute('data-theme');
    page.querySelector('#app').replaceChildren();
    page.querySelector('#refine-data').textContent =
      core.pageData({ fileName: source.fileName, markdown: core.writeDocument(state.doc), history });
    return `<!DOCTYPE html>\n${page.outerHTML}\n`;
  }

  function pageName() {
    const opened = decodeURIComponent(window.location.pathname.split('/').pop() || '');
    return /\.html?$/i.test(opened) ? opened : `${source.fileName.replace(/\.(md|markdown)$/i, '')}.html`;
  }

  async function save() {
    const history = core.recordSave(state.history, state.doc.text, reader(), now());
    const html = pageHtml(history);
    if (window.showSaveFilePicker) {
      try {
        state.fileHandle = state.fileHandle || await window.showSaveFilePicker({
          suggestedName: pageName(),
          types: [{ description: 'Refine review page', accept: { 'text/html': ['.html'] } }],
        });
        const writable = await state.fileHandle.createWritable();
        await writable.write(html);
        await writable.close();
        state.history = history;
        saved(`Saved to ${state.fileHandle.name}.`);
        return;
      } catch (problem) {
        if (problem.name === 'AbortError') return;
        state.fileHandle = null;
      }
    }
    download(html, 'text/html', pageName());
    state.history = history;
    saved(`Downloaded ${pageName()} — that copy holds your changes.`);
  }

  function download(content, type, name) {
    const link = h('a', { href: URL.createObjectURL(new Blob([content], { type })), download: name });
    link.click();
    window.setTimeout(() => URL.revokeObjectURL(link.href), 10000);
  }

  // The same markdown the command line would extract; it does not count as saving the page.
  function exportMarkdown() {
    const name = /\.(md|markdown)$/i.test(source.fileName) ? source.fileName : `${source.fileName}.md`;
    download(core.writeDocument(state.doc), 'text/markdown', name);
    notify(`Downloaded ${name}.`, false);
  }

  function saved(message) {
    state.dirty = false;
    unsaved.hidden = true;
    notify(message, false);
  }

  function notify(message, isError) {
    toast.textContent = message;
    toast.classList.toggle('error', isError);
    toast.hidden = false;
    window.clearTimeout(notify.timer);
    notify.timer = window.setTimeout(() => { toast.hidden = true; }, 5000);
  }

  window.addEventListener('hashchange', jumpToFragment);

  window.addEventListener('beforeunload', (event) => {
    if (!state.dirty) return;
    event.preventDefault();
    event.returnValue = '';
  });

  document.addEventListener('keydown', (event) => {
    const command = event.metaKey || event.ctrlKey;
    if (command && event.key.toLowerCase() === 's') {
      event.preventDefault();
      save();
    } else if (command && event.key === 'Enter' && event.target.form) {
      event.target.form.requestSubmit();
    } else if (event.key === 'Escape') {
      closeComposer();
      help.hidden = true;
      if (state.editing) {
        state.editing = null;
        render();
      }
    }
  });

  // ---- theme ---------------------------------------------------------------------------------

  function toggleTheme() {
    const root = document.documentElement;
    const light = root.dataset.theme
      ? root.dataset.theme === 'light'
      : window.matchMedia('(prefers-color-scheme: light)').matches;
    root.dataset.theme = light ? 'dark' : 'light';
    remember('refine.theme', root.dataset.theme);
  }

  if (remembered('refine.theme')) document.documentElement.dataset.theme = remembered('refine.theme');
  document.title = `${source.fileName} — refine`;
  render();
  jumpToFragment();
})();
</script>
</body>
</html>
